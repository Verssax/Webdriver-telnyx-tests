name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.browser }} test image
        run: |
          docker build \
            --build-arg BROWSER_IMAGE=selenium/standalone-${{ matrix.browser }}:130.0 \
            --build-arg WDIO_CONF=config/wdio.${{ matrix.browser }}.conf.js \
            -t telnyx-tests-${{ matrix.browser }} .

      - name: Run tests in Docker
        run: |
          mkdir -p allure-results
          docker run --rm \
            -e HEADLESS=true \
            -e BASE_URL=https://telnyx.com/ \
            -v ${{ github.workspace }}/allure-results:/app/allure-results \
            telnyx-tests-${{ matrix.browser }}

      - name: Upload Allure results (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results
          retention-days: 5

  report:
    name: Build & deploy Allure report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Set up Java (required by the Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Allure commandline
        run: npm install -g allure-commandline

      - name: Generate Allure report
        run: allure generate allure-results --clean -o allure-report

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
